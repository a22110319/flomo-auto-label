[package]
name = "flomo-capture-desktop"
version = "0.1.0"
description = "flomo 本地桌面采集器"
authors = ["flomo-capture"]
edition = "2021"

[lib]
name = "flomo_capture_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
